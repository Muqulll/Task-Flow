{% extends 'base.html' %}
{% block title %}Password Reset Complete - TaskFlow{% endblock %}

{% block content %}
<h2 class="text-2xl font-bold mb-4 text-center text-white">Password Reset Complete</h2>
<p class="text-sm text-slate-300 mb-8 text-center">
    Your password has been set successfully. You can now log in with your new credentials.
</p>

<div class="text-center">
    <a href="{% url 'login' %}" class="inline-block w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg">
        Proceed to Login
    </a>
</div>
{% endblock %}
