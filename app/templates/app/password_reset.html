{% extends 'base.html' %}

{% block title %}Reset Password - TaskFlow{% endblock %}

{% block content %}
<main class="w-full max-w-md bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700/50">
    
    <!-- Header -->
    <div class="mb-6">
        <h2 class="text-2xl font-bold tracking-tight text-white">Reset Password</h2>
        <p class="text-slate-400 text-sm mt-1">
            Enter your email address below, and we'll send you instructions to reset your password.
        </p>
    </div>

    <!-- Alert Banner -->
    <div id="alert-container" class="hidden mb-4 p-3 text-sm rounded-lg border"></div>

    <!-- Password Reset Form -->
    <form id="password-reset-form" class="space-y-4">
        <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                required 
                placeholder="john@example.com"
                class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" 
            />
        </div>

        <!-- Submit Button -->
        <button 
            type="submit" 
            id="submit-btn"
            class="w-full mt-2 py-3 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-lg shadow-blue-600/25 active:scale-[0.98] transition duration-150"
        >
            Send Reset Link
        </button>
    </form>

    <!-- Footer Redirect -->
    <p class="text-slate-400 text-sm text-center mt-6">
        Remember your password? <a href="{% url 'login' %}" class="text-blue-400 hover:underline font-medium">Log in</a>
    </p>

</main>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const resetForm = document.getElementById('password-reset-form');
    const alertContainer = document.getElementById('alert-container');
    const submitBtn = document.getElementById('submit-btn');

    resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        alertContainer.innerText = '';
        alertContainer.className = 'hidden mb-4 p-3 text-sm rounded-lg border';

        const email = document.getElementById('email').value;

        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending...';

        try {
            const response = await fetch('/api/password-reset/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ email: email }),
            });

            const data = await response.json();

            if (!response.ok) {
                alertContainer.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg';
                alertContainer.innerText = data.error || 'Failed to send reset link.';
                alertContainer.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerText = 'Send Reset Link';
            } else {
                // Redirect directly to your "Check Your Inbox" email sent template!
                window.location.href = '{% url "password_reset_done" %}';
            }
        } catch (err) {
            alertContainer.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg';
            alertContainer.innerText = 'Server error. Please try again later.';
            alertContainer.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerText = 'Send Reset Link';
        }
    });
</script>
{% endblock %}
