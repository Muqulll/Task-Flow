{% extends 'base.html' %}

{% block title %}Enter New Password - TaskFlow{% endblock %}

{% block content %}
<main class="w-full max-w-md bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700/50">
    
    <!-- Header -->
    <div class="mb-6">
        <h2 class="text-2xl font-bold tracking-tight text-white">Set New Password</h2>
        <p class="text-slate-400 text-sm mt-1">
            Please enter your new password below.
        </p>
    </div>

    <!-- Alert Banner -->
    <div id="alert-container" class="hidden mb-4 p-3 text-sm rounded-lg border"></div>

    <!-- Confirm Password Form -->
    <form id="password-confirm-form" class="space-y-4">
        
        <!-- New Password -->
        <div>
            <label for="new-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">New Password</label>
            <input 
                type="password" 
                id="new-password" 
                name="new_password" 
                required 
                placeholder="••••••••"
                class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" 
            />
        </div>

        <!-- Confirm Password -->
        <div>
            <label for="confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Confirm New Password</label>
            <input 
                type="password" 
                id="confirm-password" 
                name="confirm_password" 
                required 
                placeholder="••••••••"
                class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" 
            />
        </div>

        <!-- Submit Button -->
        <button 
            type="submit" 
            id="submit-btn"
            class="w-full mt-2 py-3 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold shadow-lg shadow-blue-600/25 active:scale-[0.98] transition duration-150"
        >
            Change My Password
        </button>

    </form>

</main>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const confirmForm = document.getElementById('password-confirm-form');
    const alertContainer = document.getElementById('alert-container');
    const submitBtn = document.getElementById('submit-btn');

    confirmForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        alertContainer.innerText = '';
        alertContainer.className = 'hidden mb-4 p-3 text-sm rounded-lg border';

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (newPassword !== confirmPassword) {
            alertContainer.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg';
            alertContainer.innerText = 'Passwords do not match.';
            alertContainer.classList.remove('hidden');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Updating password...';

        try {
            const response = await fetch('/api/password-reset-confirm/{{ uidb64 }}/{{ token }}/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({
                    new_password: newPassword,
                    confirm_password: confirmPassword
                }),
            });

            const data = await response.json();

            if (!response.ok) {
                let errorMessage = 'Failed to reset password.';
                if (typeof data === 'object') {
                    const firstKey = Object.keys(data)[0];
                    if (firstKey) {
                        const errVal = data[firstKey];
                        errorMessage = Array.isArray(errVal) ? `${firstKey}: ${errVal[0]}` : (data.error || errorMessage);
                    } else if (data.error) {
                        errorMessage = data.error;
                    }
                }
                alertContainer.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg';
                alertContainer.innerText = errorMessage;
                alertContainer.classList.remove('hidden');
            } else {
                alertContainer.className = 'mb-4 p-3 bg-green-500/10 border border-green-500/50 text-green-400 text-sm rounded-lg';
                alertContainer.innerText = data.message;
                alertContainer.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 2000);
            }
        } catch (err) {
            alertContainer.className = 'mb-4 p-3 bg-red-500/10 border border-red-500/50 text-red-400 text-sm rounded-lg';
            alertContainer.innerText = 'Server error. Please try again later.';
            alertContainer.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Change My Password';
        }
    });
</script>
{% endblock %}
